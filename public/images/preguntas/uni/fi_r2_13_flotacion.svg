<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img"><title>Mismo cuerpo flotando en agua y en otro líquido de densidad 800 kilogramos por metro cúbico</title><rect width="600" height="340" rx="14" fill="#f6f9fd"/><g font-family="Arial,sans-serif"><rect x="50" y="80" width="220" height="190" fill="#fff" stroke="#173d70" stroke-width="2"/><rect x="51" y="150" width="218" height="119" fill="#dceafa"/><rect x="120" y="90" width="70" height="150" fill="none" stroke="#173d70" stroke-width="2"/><line x1="50" y1="150" x2="270" y2="150" stroke="#173d70" stroke-width="2.5"/><text x="230" y="205" text-anchor="middle" fill="#173d70" font-size="17">60 %</text><text x="160" y="302" text-anchor="middle" fill="#173d70" font-size="16">Agua: 1000 kg/m³</text><rect x="330" y="80" width="220" height="190" fill="#fff" stroke="#173d70" stroke-width="2"/><rect x="331" y="127.5" width="218" height="141.5" fill="#f4e8bd"/><rect x="400" y="90" width="70" height="150" fill="none" stroke="#173d70" stroke-width="2"/><line x1="330" y1="127.5" x2="550" y2="127.5" stroke="#173d70" stroke-width="2.5"/><text x="440" y="302" text-anchor="middle" fill="#173d70" font-size="16">Líquido: 800 kg/m³</text><text x="440" y="325" text-anchor="middle" fill="#173d70" font-size="16">Fracción sumergida: ?</text></g></svg>
