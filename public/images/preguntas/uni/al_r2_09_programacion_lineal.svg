<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img"><title>Rectas de las restricciones de programación lineal</title><rect width="600" height="340" rx="14" fill="#f6f9fd"/><g font-family="Arial,sans-serif"><line x1="90" y1="280" x2="540" y2="280" stroke="#173d70" stroke-width="2.5"/><line x1="90" y1="280" x2="90" y2="35" stroke="#173d70" stroke-width="2.5"/><line x1="90" y1="70" x2="510" y2="280" stroke="#9a2638" stroke-width="2.5"/><line x1="90" y1="175" x2="510" y2="245" stroke="#2c7f78" stroke-width="2.5"/><line x1="195" y1="275" x2="195" y2="285" stroke="#173d70" stroke-width="2.5"/><text x="195" y="307" text-anchor="middle" fill="#173d70" font-size="16">1</text><line x1="300" y1="275" x2="300" y2="285" stroke="#173d70" stroke-width="2.5"/><text x="300" y="307" text-anchor="middle" fill="#173d70" font-size="16">2</text><line x1="405" y1="275" x2="405" y2="285" stroke="#173d70" stroke-width="2.5"/><text x="405" y="307" text-anchor="middle" fill="#173d70" font-size="16">3</text><line x1="510" y1="275" x2="510" y2="285" stroke="#173d70" stroke-width="2.5"/><text x="510" y="307" text-anchor="middle" fill="#173d70" font-size="16">4</text><text x="65" y="232.5" text-anchor="middle" fill="#173d70" font-size="16">1</text><text x="65" y="180.0" text-anchor="middle" fill="#173d70" font-size="16">2</text><text x="65" y="127.5" text-anchor="middle" fill="#173d70" font-size="16">3</text><text x="65" y="75.0" text-anchor="middle" fill="#173d70" font-size="16">4</text><text x="550" y="283" text-anchor="middle" fill="#173d70" font-size="19">x</text><text x="75" y="30" text-anchor="middle" fill="#173d70" font-size="19">y</text><text x="310" y="65" text-anchor="middle" fill="#9a2638" font-size="17">x + y = 4</text><text x="350" y="203" text-anchor="middle" fill="#2c7f78" font-size="17">x + 3y = 6</text></g></svg>
