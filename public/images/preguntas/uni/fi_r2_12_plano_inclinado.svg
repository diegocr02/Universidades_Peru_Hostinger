<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img"><title>Bloque de 2 kilogramos que desciende 5 metros por un plano de 37 grados con rozamiento</title><rect width="600" height="340" rx="14" fill="#f6f9fd"/><g font-family="Arial,sans-serif"><polygon points="110,270 430,270 430,30" fill="#edf1f7" stroke="#173d70" stroke-width="2.5"/><g transform="translate(300 127.5) rotate(-36.87)"><rect x="-25" y="-30" width="50" height="30" fill="#f0d180" stroke="#173d70" stroke-width="2"/></g><text x="300" y="95" text-anchor="middle" fill="#173d70" font-size="17">2 kg</text><text x="170" y="258" text-anchor="middle" fill="#173d70" font-size="16">37°</text><text x="215" y="150" text-anchor="middle" fill="#173d70" font-size="18">5 m</text><text x="500" y="175" text-anchor="middle" fill="#173d70" font-size="18">μ=0,25</text><text x="300" y="315" text-anchor="middle" fill="#173d70" font-size="17">Parte del reposo; g=10 m/s²</text></g></svg>
