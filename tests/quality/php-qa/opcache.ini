; Solo para el servidor QA local (php artisan serve en :8001).
; ejecutar-pruebas.ps1 lo carga con PHP_INI_SCAN_DIR; no modifica el php.ini global.
; Sin OPcache cada petición recompila Laravel (~0.25 s) y el servidor de un solo
; proceso hace cola con 15 usuarios (p95 ~5 s). Con OPcache baja a ~0.02 s.
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.validate_timestamps=1
opcache.revalidate_freq=2
